name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Firma
        run: |
          cat > keystore.properties <<'KEYS'
          storeFile=app/spoty.jks
          storePassword=R2x4Wlsijo1gomY6IPU0
          keyAlias=spoty
          keyPassword=R2x4Wlsijo1gomY6IPU0
          KEYS
      - name: Compilar
        run: ./gradlew assembleProdRelease -Pbitchord.bundleWear=false --no-daemon
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/prod/release/*arm64-v8a*.apk | head -n1)
          cp "$apk" spoty-ottmty.apk
          gh release create "v${{ github.run_number }}" spoty-ottmty.apk --title "Spoty OTTMTY v${{ github.run_number }}" --notes "Última versión de Spoty OTTMTY." --latest
