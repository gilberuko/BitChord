name: Build APK (login)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Debug build: signed with the debug key, so it installs without any secrets.
      - name: Build prod debug APK
        run: ./gradlew assembleProdDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bitchord-login-debug
          path: app/build/outputs/apk/prod/debug/*.apk
